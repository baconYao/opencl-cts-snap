name: Snap CI

on:
  pull_request:
    branches:
      - main
      - baconyao-experiment
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    branches:
      - baconyao-experiment
    types:
      - closed
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: Build ${{ matrix.base }} (${{ matrix.arch }}) snap
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # base:    the project directory to build (each is a self-contained
          #          snapcraft project rooted at <dir>/snap/snapcraft.yaml)
          # arch:    informational label for the build matrix entry
          # runs-on: GitHub-hosted runner matching the arch being built
          - base: core22
            arch: amd64
            runs-on: ubuntu-24.04
            release: core22/edge
          - base: core22
            arch: arm64
            runs-on: ubuntu-24.04-arm
            release: core22/edge
          - base: core24
            arch: amd64
            runs-on: ubuntu-24.04
            release: edge
          - base: core24
            arch: arm64
            runs-on: ubuntu-24.04-arm
            release: edge
          - base: core26
            arch: amd64
            runs-on: ubuntu-24.04
            release: core26/edge
          - base: core26
            arch: arm64
            runs-on: ubuntu-24.04-arm
            release: core26/edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Verify Snap Store credentials
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'baconyao-experiment')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not configured"
            exit 1
          fi

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: ${{ matrix.base }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencl-cts-snap-${{ matrix.base }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'baconyao-experiment')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ matrix.release }}
