name: Snap CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.base }} (${{ matrix.arch }}) snap
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # base:    the project directory to build (each is a self-contained
          #          snapcraft project rooted at <dir>/snap/snapcraft.yaml)
          # arch:    informational label for the build matrix entry
          # runs-on: GitHub-hosted runner matching the arch being built
          - base: core22
            arch: amd64
            runs-on: ubuntu-24.04
            release: core22/edge
          - base: core22
            arch: arm64
            runs-on: ubuntu-24.04-arm
            release: core22/edge
          - base: core24
            arch: amd64
            runs-on: ubuntu-24.04
            release: edge
          - base: core24
            arch: arm64
            runs-on: ubuntu-24.04-arm
            release: edge
          - base: core26
            arch: amd64
            runs-on: ubuntu-24.04
            release: core26/edge
          - base: core26
            arch: arm64
            runs-on: ubuntu-24.04-arm
            release: core26/edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: ${{ matrix.base }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencl-cts-snap-${{ matrix.base }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ matrix.release }}
